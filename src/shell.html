<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大富翁 4Fun · 复刻版</title>
<style>
<!--CSS-->
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="center">
        <div class="emblem"></div>
        <svg class="skyline" viewBox="0 0 640 130" preserveAspectRatio="none" aria-hidden="true">
          <g fill="#04241c" opacity=".55">
            <rect x="0" y="70" width="34" height="60"/><rect x="30" y="46" width="26" height="84"/>
            <rect x="54" y="82" width="40" height="48"/><rect x="90" y="30" width="30" height="100"/>
            <rect x="118" y="62" width="22" height="68"/><rect x="138" y="88" width="46" height="42"/>
            <rect x="182" y="54" width="28" height="76"/><rect x="208" y="18" width="18" height="112"/>
            <rect x="224" y="66" width="36" height="64"/><rect x="258" y="40" width="24" height="90"/>
            <rect x="280" y="76" width="44" height="54"/><rect x="322" y="24" width="20" height="106"/>
            <rect x="340" y="58" width="30" height="72"/><rect x="368" y="86" width="38" height="44"/>
            <rect x="404" y="38" width="26" height="92"/><rect x="428" y="68" width="22" height="62"/>
            <rect x="448" y="50" width="34" height="80"/><rect x="480" y="16" width="18" height="114"/>
            <rect x="496" y="72" width="40" height="58"/><rect x="534" y="44" width="26" height="86"/>
            <rect x="558" y="80" width="34" height="50"/><rect x="590" y="56" width="24" height="74"/>
            <rect x="612" y="88" width="28" height="42"/>
          </g>
        </svg>
        <div class="ribbon" id="roundTip">第 1 / 40 回合</div>
        <div class="logo">
          <h1>大富翁</h1>
          <div class="fourfun">RICHMAN 4 FUN</div>
          <div class="sub">复 刻 版</div>
        </div>
        <div class="market" id="market"></div>
        <div class="godbar" id="godbar"></div>
        <div class="turn-badge" id="badge">
          <div class="av" id="badgeAv"></div>
          <div>
            <div class="nm" id="badgeNm">准备开始</div>
            <div class="cash" id="badgeCash">—</div>
          </div>
        </div>
        <div class="dice-row">
          <div class="die" id="die1"></div>
          <div class="die" id="die2"></div>
          <button class="roll-btn" id="rollBtn" disabled>掷骰子</button>
        </div>
        <div class="newsline" id="newsline"></div>
        <div class="ticker" id="ticker">买地、盖楼、炒股、请神，把对手的钱都赢过来！</div>
      </div>
      <div class="pawns" id="pawns"></div>
    </div>
  </div>

  <div class="side">
    <div id="players"></div>
    <div class="panel-box">
      <div class="box-title"><span>🎒 我的道具</span><span class="pts" id="ptsChip">💎 0</span></div>
      <div class="itemgrid" id="itemgrid"></div>
    </div>
    <div class="logbox" id="log"></div>
    <div class="side-btns">
      <button id="rulesBtn">📖 规则</button>
      <button id="bankBtn">🏦 银行</button>
      <button id="stockBtn">📈 股票</button>
      <button id="muteBtn">🔊 音效</button>
    </div>
  </div>
</div>

<!-- 开始页 -->
<div class="start" id="startScreen">
  <div class="deco-layer" aria-hidden="true">
    <span style="--x:5%;--y:15%;--s:42px;--d:0s">🎲</span>
    <span style="--x:90%;--y:11%;--s:34px;--d:1.2s">📈</span>
    <span style="--x:12%;--y:76%;--s:32px;--d:2.1s">🏠</span>
    <span style="--x:86%;--y:72%;--s:38px;--d:.6s">🏢</span>
    <span style="--x:3%;--y:46%;--s:24px;--d:1.8s">💰</span>
    <span style="--x:94%;--y:44%;--s:26px;--d:2.6s">🎁</span>
    <span style="--x:23%;--y:7%;--s:20px;--d:3.1s">🔮</span>
    <span style="--x:73%;--y:90%;--s:22px;--d:.9s">⛩️</span>
  </div>
  <div class="big-logo">
    <h1>大富翁</h1>
    <div class="en">RICHMAN 4 FUN</div>
    <div class="tag">复 刻 版 · 骰 子 大 亨</div>
  </div>
  <div class="pick-title">选择你的角色</div>
  <div class="chars" id="chars"></div>
  <div class="pick-title" style="margin-top:2px">玩家人数</div>
  <div class="counts" id="counts">
    <button data-n="2">2 人</button>
    <button data-n="3">3 人</button>
    <button data-n="4" class="on">4 人</button>
  </div>
  <button class="start-btn" id="startBtn">开始游戏</button>
  <div class="hint">48 格棋盘 · 28 块地产 · 12 种道具 · 6 位神仙 · 4 支股票 · 建议横屏</div>
</div>

<!-- 通用弹窗 -->
<div class="overlay" id="ovl"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<div id="autotest-result" style="display:none"></div>

<script>
<!--JS-->
</script>
</body>
</html>
