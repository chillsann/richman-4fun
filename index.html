<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大富翁 4Fun · 复刻版</title>
<style>
body.nofx *,body.nofx *::before,body.nofx *::after{transition:none!important;animation:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cell:58px;
  --gold:#e9c874;--gold2:#b8912f;
  --cream:#fbf2dd;--ink:#4a3520;
  --font-title:"STHupo","华文琥珀","STHeiti","SimHei","Microsoft YaHei",sans-serif;
}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:#fff;
  background:radial-gradient(1100px 620px at 50% -12%, #24667a 0%, #103743 52%, #071c24 100%),#071c24;
  min-height:100vh;display:grid;place-items:center;padding:14px;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(220px 220px at 18% 22%, rgba(255,214,140,.10), transparent 65%),
    radial-gradient(260px 260px at 82% 18%, rgba(140,220,255,.09), transparent 65%),
    radial-gradient(300px 300px at 70% 84%, rgba(255,150,190,.08), transparent 65%),
    radial-gradient(240px 240px at 26% 80%, rgba(160,255,190,.07), transparent 65%);
  animation:drift 24s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-12px,-8px,0) scale(1)}to{transform:translate3d(14px,10px,0) scale(1.05)}}

/* ============ 布局 ============ */
.stage{position:relative;z-index:1;display:flex;gap:14px;align-items:flex-start}
.board-wrap{
  position:relative;padding:13px;border-radius:24px;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 2px, rgba(255,255,255,.035) 2px 5px, transparent 5px 11px),
    linear-gradient(150deg,#8a5a30 0%,#5b3618 32%,#3f2410 70%,#6f4722 100%);
  box-shadow:0 34px 70px rgba(0,0,0,.62),0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,232,180,.35),inset 0 -4px 0 rgba(0,0,0,.4);
}
.board-wrap::after{content:"";position:absolute;inset:6px;border-radius:19px;pointer-events:none;
  border:1px solid rgba(255,220,150,.22);box-shadow:inset 0 0 22px rgba(0,0,0,.45)}
.board{
  position:relative;display:grid;
  grid-template-columns:repeat(13,var(--cell));
  grid-template-rows:repeat(13,var(--cell));
  border-radius:12px;background:#e6d3ac;
  box-shadow:inset 0 0 0 3px #b8912f, inset 0 0 34px rgba(80,50,20,.45);
}

/* ============ 格子 ============ */
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:7px 2px 16px;overflow:hidden;user-select:none;cursor:pointer;
  background:linear-gradient(180deg,#fff8e8 0%,#f9edd6 55%,#f3e2c2 100%);
  border:1px solid rgba(120,88,48,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -3px 0 rgba(150,112,62,.10);
  transition:transform .14s ease, box-shadow .14s ease;
}
.tile::before{content:"";position:absolute;inset:2px;border-radius:3px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75), inset 0 0 10px rgba(160,120,70,.10)}
.tile:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 8px 18px rgba(20,10,0,.45);z-index:6}
.tile .tint{position:absolute;inset:0;pointer-events:none}
.tile.corner{background:linear-gradient(160deg,#33765e 0%,#215442 58%,#16382c 100%)}
.tile.corner::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,226,160,.28);border-radius:4px;pointer-events:none}
.tile.corner .cicon{font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.tile.corner .cname{font-family:var(--font-title);font-size:11px;color:#ffe6a8;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap}
.tile.corner .csub{font-size:7px;color:#ffd9a0;opacity:.82;white-space:nowrap}

.band{position:absolute;top:0;left:0;right:0;height:9px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,transparent 2px 6px);opacity:.6}
.tname{font-size:10.5px;font-weight:800;color:#4a3520;white-space:nowrap;letter-spacing:-.3px;margin-top:6px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.tname.sm{font-size:9px;letter-spacing:-.5px}
.tprice{font-size:7.5px;color:#9a7c50;font-weight:800;background:rgba(180,145,90,.16);border-radius:4px;padding:0 3px;line-height:1.45}
.dyn{position:absolute;left:0;right:0;bottom:0;height:15px}
.own{position:absolute;left:0;right:0;bottom:0;height:15px;display:flex;align-items:center;justify-content:center;
  gap:0;font-size:8px;line-height:1;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.18)}
.own .h{font-size:9px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tile.chance{background:linear-gradient(180deg,#fff2f6 0%,#ffe0ea 60%,#ffd2e0 100%)}
.tile.fate{background:linear-gradient(180deg,#f3efff 0%,#e4dbff 60%,#d8ccff 100%)}
.tile.tax{background:linear-gradient(180deg,#fff6de 0%,#ffe9b8 60%,#ffdf9f 100%)}
.tile.store{background:linear-gradient(180deg,#ecfbf2 0%,#d3f3e0 60%,#bfeacf 100%)}
.tile.stock{background:linear-gradient(180deg,#e8f4ff 0%,#cfe6fb 60%,#b8d8f5 100%)}
.tile.bank{background:linear-gradient(180deg,#fff8e0 0%,#ffedb5 60%,#ffe08c 100%)}
.tile.news{background:linear-gradient(180deg,#eef2f7 0%,#dde6f0 60%,#cbd8e6 100%)}
.tile.temple{background:linear-gradient(180deg,#fff0e6 0%,#ffdcc4 60%,#ffcba8 100%)}
.tile .sicon{font-size:17px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22))}
.tile .sname{font-size:9px;font-weight:800;color:#6b4a28;letter-spacing:.2px;white-space:nowrap}
.tile.chance .sname{color:#b5456e}
.tile.fate .sname{color:#5f4a9e}
.tile.tax .sname{color:#96701c}
.tile.store .sname{color:#21795a}
.tile.stock .sname{color:#1c5f96}
.tile.bank .sname{color:#946a12}
.tile.news .sname{color:#4a5a72}
.tile.temple .sname{color:#a04a22}
.pot{position:absolute;top:2px;right:3px;font-size:7.5px;font-weight:800;color:#fff;background:#e2564d;border-radius:5px;padding:0 3px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.hazard{position:absolute;left:2px;top:2px;font-size:12px;line-height:1;z-index:3;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));animation:hz 1.4s ease-in-out infinite}
@keyframes hz{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tile.glow{box-shadow:inset 0 0 0 3px #ffd76a, 0 0 18px rgba(255,215,106,.55)}
.tile.lvmax .tname{color:#8a5a08}

/* ============ 棋盘中心 ============ */
.center{
  grid-area:2/2/13/13;position:relative;border-radius:16px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 22%, rgba(255,224,150,.20), transparent 62%),
    radial-gradient(circle at 50% 118%, rgba(0,0,0,.5), transparent 58%),
    linear-gradient(160deg,#2f735c,#16503f 58%,#0e3128);
  box-shadow:inset 0 0 0 3px #c9a34d, inset 0 0 0 8px rgba(255,243,201,.10), inset 0 0 90px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;
}
.center::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);background-size:14px 14px}
.emblem{position:absolute;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-54%);
  border-radius:50%;pointer-events:none;opacity:.22;
  background:repeating-conic-gradient(from 0deg, rgba(255,214,140,.5) 0deg 1.2deg, transparent 1.2deg 12deg);
  mask-image:radial-gradient(circle, transparent 44%, #000 45%, #000 60%, transparent 61%);
  -webkit-mask-image:radial-gradient(circle, transparent 44%, #000 45%, #000 60%, transparent 61%);
  animation:spin 70s linear infinite}
@keyframes spin{to{transform:translate(-50%,-54%) rotate(360deg)}}
.ribbon{position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:4px 15px;border-radius:20px;
  font-size:10.5px;font-weight:800;letter-spacing:2px;color:#5a3a08;
  background:linear-gradient(180deg,#ffeab0,#e9bf63);box-shadow:0 3px 0 #a8802a, inset 0 1px 0 rgba(255,255,255,.7)}
.logo{position:relative;z-index:2;text-align:center;line-height:1}
.logo h1{font-family:var(--font-title);font-size:44px;letter-spacing:3px;
  background:linear-gradient(180deg,#fffbe2 0%,#ffdc86 34%,#e3aa3c 64%,#ad761c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #4d300c) drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.logo .fourfun{font-family:var(--font-title);font-size:11px;color:#bff0d9;letter-spacing:4px;margin-top:3px;opacity:.85}
.logo .sub{font-size:9px;letter-spacing:6px;color:#ffe3a8;opacity:.8;margin-top:4px;font-weight:700}

.turn-badge{position:relative;z-index:2;display:flex;align-items:center;gap:9px;padding:6px 15px 6px 6px;border-radius:40px;
  background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 8px 18px rgba(0,0,0,.32)}
.turn-badge .av{width:32px;height:32px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.turn-badge .av svg{width:100%;height:100%;display:block}
.turn-badge .nm{font-size:12.5px;font-weight:800;letter-spacing:.5px}
.turn-badge .cash{font-size:10px;opacity:.88;font-variant-numeric:tabular-nums;margin-top:1px}
.dice-row{position:relative;z-index:2;display:flex;align-items:center;gap:9px}
.die{width:44px;height:44px;border-radius:11px;background:linear-gradient(160deg,#fffdf8,#e6e1d6);
  box-shadow:0 5px 0 #b4ac9c, 0 10px 16px rgba(0,0,0,.4), inset 0 2px 0 #fff;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:7px;gap:1px;transition:transform .12s}
.die .pip{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6b6257,#2b2620);opacity:0;place-self:center}
.die .pip.on{opacity:1}
.die.rolling{animation:dieShake .12s linear infinite}
@keyframes dieShake{0%{transform:rotate(-7deg) scale(1.05)}50%{transform:rotate(6deg) scale(.97)}100%{transform:rotate(-3deg)}}
.roll-btn{border:none;cursor:pointer;font-family:var(--font-title);font-size:15px;letter-spacing:2px;
  color:#5a3a08;padding:11px 22px;border-radius:15px;
  background:linear-gradient(180deg,#ffeaa6 0%,#f5c95e 55%,#d9a63a 100%);
  box-shadow:0 6px 0 #9c701c, 0 12px 22px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .07s, box-shadow .07s;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.roll-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #9c701c,0 4px 10px rgba(0,0,0,.4)}
.roll-btn:disabled{filter:grayscale(.55) brightness(.85);cursor:default;box-shadow:0 6px 0 #6b5a3a}
.skyline{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:1;pointer-events:none;opacity:.8}
.market{position:relative;z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mkt{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9px;cursor:pointer;
  background:rgba(0,0,0,.26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);transition:.15s;
  font-size:10px;font-variant-numeric:tabular-nums}
.mkt:hover{background:rgba(0,0,0,.4);transform:translateY(-1px)}
.mkt .mk-n{color:#cfe8dd;opacity:.9}
.mkt .mk-p{font-weight:900;color:#ffe9a8}
.mkt.up .mk-a{color:#ff8e7e}
.mkt.down .mk-a{color:#7de0a8}
.godbar{position:relative;z-index:2;display:flex;gap:6px;min-height:0}.god-chip{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 9px;border-radius:12px;
  background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.god-chip.bad{background:rgba(220,80,80,.24);box-shadow:inset 0 0 0 1px rgba(255,120,120,.45)}
.newsline{position:relative;z-index:2;max-width:90%;font-size:10.5px;color:#ffe6b0;
  background:rgba(0,0,0,.28);border-radius:9px;padding:3px 11px;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newsline:empty{display:none}
.ticker{position:relative;z-index:2;max-width:92%;min-height:15px;text-align:center;font-size:10.5px;color:#e9fff5;opacity:.9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 棋子 ============ */
.pawns{position:absolute;inset:0;pointer-events:none;z-index:9}
.pawn{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#fff;
  box-shadow:0 4px 8px rgba(0,0,0,.5), 0 0 0 2px rgba(0,0,0,.12);
  transition:transform .13s cubic-bezier(.34,1.4,.64,1);will-change:transform}
.pawn svg{width:100%;height:100%;display:block}
.pawn.moving{animation:hop .13s ease}
@keyframes hop{0%{margin-top:0}50%{margin-top:-6px}100%{margin-top:0}}
.pawn.turn{box-shadow:0 4px 8px rgba(0,0,0,.5), 0 0 0 3px #ffd76a, 0 0 14px rgba(255,215,106,.9)}

/* ============ 侧栏 ============ */
.side{width:352px;display:flex;flex-direction:column;gap:8px}
.pcard{position:relative;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 8px 18px rgba(0,0,0,.22);transition:.2s;overflow:hidden}
.pcard.dead{opacity:.4;filter:grayscale(1)}
.pcard.act{background:linear-gradient(180deg,rgba(255,215,106,.28),rgba(255,215,106,.08));box-shadow:inset 0 0 0 2px #ffd76a,0 8px 22px rgba(255,190,60,.25)}
.pcard .av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.pcard .av svg{width:100%;height:100%;display:block}
.pinfo{flex:1;min-width:0}
.prow1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pname{font-size:12px;font-weight:800;letter-spacing:.4px}
.pcash{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffe9a8;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.prow2{display:flex;gap:7px;font-size:9.5px;color:#a8cfc2;margin-top:2px;font-variant-numeric:tabular-nums}
.prow2 b{color:#d8f0e6;font-weight:800}
.prow3{display:flex;justify-content:space-between;align-items:center;margin-top:3px;gap:4px}
.dots{display:flex;gap:2px;flex-wrap:wrap;max-width:140px}
.dot{width:6px;height:6px;border-radius:2px;opacity:.95}
.badge{font-size:9px;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.35);color:#ffd9a0;font-weight:700;margin-left:3px;white-space:nowrap}
.badge.jail{background:#c0392b;color:#fff}
.badge.hosp{background:#e07b39;color:#fff}
.badge.god{background:#b8912f;color:#3a2400}
.badge.god.bad{background:#8a3a3a;color:#ffd9d9}
.badge.turtle{background:#2f9b72;color:#fff}
.badge.angel{background:#4a90d9;color:#fff}
.medal{position:absolute;right:6px;top:6px;font-size:11px}

.panel-box{border-radius:14px;padding:7px 9px;background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.box-title{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1px;color:#bfe6da;margin-bottom:5px}
.box-title .pts{color:#ffe08a;font-weight:800;font-variant-numeric:tabular-nums}
.itemgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  height:38px;border-radius:9px;background:rgba(255,255,255,.10);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:.14s;border:none;color:#eafff5;font-family:inherit}
.it:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.it .ic{font-size:15px;line-height:1}
.it .nm{font-size:7.5px;opacity:.85;white-space:nowrap;transform:scale(.92)}
.it .ct{position:absolute;right:2px;top:1px;font-size:8px;font-weight:900;color:#ffe08a;text-shadow:0 1px 2px #000}
.it.empty{opacity:.28;cursor:default}
.it.empty:hover{transform:none;background:rgba(255,255,255,.10)}

.logbox{flex:1;min-height:120px;max-height:150px;overflow:auto;border-radius:14px;padding:8px 10px;
  background:rgba(0,0,0,.26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  font-size:10.5px;line-height:1.7;color:#dbeade}
.logbox .ln{animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.logbox b{font-weight:800}
.side-btns{display:flex;gap:6px}
.side-btns button{flex:1;border:none;cursor:pointer;border-radius:11px;padding:8px 2px;font-size:11px;font-weight:800;font-family:inherit;
  background:rgba(255,255,255,.13);color:#eafff5;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.side-btns button:hover{background:rgba(255,255,255,.2)}

/* ============ 浮动金额 ============ */
.float{position:fixed;z-index:80;font-size:14px;font-weight:900;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);
  animation:floatUp 1.05s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.8)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:90;
  background:rgba(10,30,36,.94);color:#ffe9b8;padding:8px 17px;border-radius:30px;font-size:12.5px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,215,106,.4);
  opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(6px)}

/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;
  background:rgba(5,18,24,.72);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:auto}
.panel{position:relative;width:min(520px,92vw);max-height:92vh;overflow:auto;border-radius:22px;padding:22px 22px 18px;color:var(--ink);text-align:center;
  background:linear-gradient(180deg,#fffdf6,#f8ecd2);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 4px #e2c07a, inset 0 0 0 10px #fffaee;
  transform:scale(.92);transition:transform .22s cubic-bezier(.2,1.3,.5,1)}
.overlay.show .panel{transform:scale(1)}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:rgba(160,120,60,.35);border-radius:4px}
.panel.kind-chance,.panel.kind-fate{animation:cardIn .42s cubic-bezier(.2,1,.4,1);padding:26px 24px 20px;min-height:280px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes cardIn{0%{transform:perspective(900px) rotateY(78deg) scale(.86);opacity:0}60%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
.panel.kind-chance{background:radial-gradient(circle at 50% 34%, rgba(255,255,255,.95), rgba(255,255,255,0) 58%),
  linear-gradient(180deg,#fff9fb 0%,#ffe9f1 62%,#ffd7e5 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 4px #ef9fbd, inset 0 0 0 9px #fff8fb, inset 0 0 0 11px rgba(239,159,189,.45)}
.panel.kind-fate{background:radial-gradient(circle at 50% 34%, rgba(255,255,255,.95), rgba(255,255,255,0) 58%),
  linear-gradient(180deg,#faf8ff 0%,#ebe4ff 62%,#dbd0ff 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 4px #ae9ae2, inset 0 0 0 9px #faf8ff, inset 0 0 0 11px rgba(174,154,226,.45)}
.panel.kind-chance .pic,.panel.kind-fate .pic{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 50% 32%,#fff,rgba(255,255,255,.55));

let S = null;
let SPEED = 1;
let MUTE = false;
let AC = null;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, Math.max(0, ms * SPEED)));

const pick = a => a[rnd(a.length)];
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const isProp = t => t.type === 'prop';
const isCorner = ty => ['start', 'jail', 'hospital', 'park'].includes(ty);

/* ---------------- 音效 ---------------- */
function tone(freq, dur, type = 'sine', vol = 0.05, delay = 0) {
  if (MUTE || SPEED === 0) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  dice: () => { tone(300, .05, 'square', .04); tone(420, .05, 'square', .04, .07); tone(520, .05, 'square', .04, .14); },
  coin: () => { tone(880, .09, 'triangle', .06); tone(1320, .12, 'triangle', .05, .07); },
  buy:  () => { tone(523, .12, 'sine', .06); tone(659, .12, 'sine', .06, .08); tone(784, .18, 'sine', .06, .16); },
  pay:  () => { tone(220, .16, 'sawtooth', .04); tone(160, .2, 'sawtooth', .035, .1); },
  bad:  () => { tone(180, .3, 'square', .04); },
  win:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'sine', .07, i * .11)); },
};

/* =====================================================================
   资产与金钱
   ===================================================================== */
function invested(t) {
  let v = t.price;
  for (let l = 0; l < t.level; l++) v += Math.round(t.price * UPG[l]);
  return v;
}
function upgCost(t) { return Math.round(t.price * UPG[t.level]); }
function buyCost(p, t) { return Math.round(t.price * (p.charId === 'tu' ? 0.9 : 1)); }
function ownsGroup(pid, group) {
  return S.tiles.filter(t => isProp(t) && t.group === group).every(t => t.owner === pid);
}
function stockValue(p) {
  return S.stocks.reduce((s, st) => s + (p.stocks[st.id] || 0) * st.price, 0);
}
function totalAssets(p) {
  return Math.round(p.cash + p.savings + stockValue(p) + p.props.reduce((s, i) => s + invested(S.tiles[i]) * 0.9, 0));
}
function allPropsOfOthers(p) {
  return S.tiles.filter(t => isProp(t) && t.owner != null && t.owner !== p.id && S.players[t.owner].alive);
}
function rentOf(t) {
  const owner = S.players[t.owner];
  if (!owner) return 0;
  let base = t.price * RENT[t.level];
  if (ownsGroup(t.owner, t.group)) base *= 2;
  if (owner.god === 'cai') base *= 2;
  base *= (S.rentMod || 1);
  return Math.round(base);
}

function gain(p, amt, quiet) {
  p.cash += amt;
  if (!quiet) {
    if (p._el) floatMoney(p, '+' + fmt(amt), '#9dffb0');
    sfx.coin();
  }
  updatePlayersOnly();
}

/** 付钱；toId 为收款人。返回 false 表示破产 */
async function payMoney(p, amount, toId = null, quiet = false) {
  const ok = await charge(p, amount, toId);
  if (ok && !quiet && p._el) floatMoney(p, '-' + fmt(amount), '#ff9c9c');
  updatePlayersOnly();
  return ok;
}

/** 扣款：现金 → 卖股票 → 取存款 → 变卖地产 → 破产 */
async function charge(p, amount, toId = null) {
  amount = Math.round(amount);
  if (amount <= 0) return true;
  if (p.cash >= amount) {
    p.cash -= amount;
    if (toId != null && S.players[toId]) S.players[toId].cash += amount;
    updatePlayersOnly();
    return true;
  }
  // 1) 卖股票
  for (const s of S.stocks) {
    if (p.cash >= amount) break;
    const sh = p.stocks[s.id] || 0;
    if (sh > 0) {
      p.stocks[s.id] = 0;
      p.cash += sh * s.price;
      p.stockCost[s.id] = 0;
      log(`📉 <b>${p.name}</b> 被迫卖出 ${s.name}股 ${sh} 股，换得 ${fmt(sh * s.price)}`);
      updatePlayersOnly();
      await sleep(160);
    }
  }
  // 2) 取存款
  if (p.cash < amount && p.savings > 0) {
    const take = Math.min(p.savings, amount - p.cash);
    p.savings -= take; p.cash += take;
    log(`🏦 <b>${p.name}</b> 从银行取出 ${fmt(take)}`);
    updatePlayersOnly();
    await sleep(160);
  }
  // 3) 变卖地产（先卖便宜的）
  let guard = 0;
  while (p.cash < amount && p.props.length && guard++ < 40) {
    p.props.sort((a, b) => invested(S.tiles[a]) - invested(S.tiles[b]));
    const ti = p.props.shift();
    const t = S.tiles[ti];
    const val = Math.round(invested(t) * 0.8);
    t.owner = null; t.level = 0;
    p.cash += val;
    log(`💸 <b>${p.name}</b> 变卖「${t.name}」换得 ${fmt(val)}`);
    refreshTile(ti); renderPark(); updatePlayersOnly();
    await sleep(200);
  }
  if (p.cash >= amount) {
    p.cash -= amount;
    if (toId != null && S.players[toId]) S.players[toId].cash += amount;
    updatePlayersOnly();
    return true;
  }
  // 4) 破产
  await goBankrupt(p, amount, toId);
  return false;
}

async function goBankrupt(p, owed, toId) {
  const lost = p.cash;
  p.cash = 0;
  p.alive = false;
  const creditor = (toId != null) ? S.players[toId] : null;
  // 地产转给债主，否则回到无主
  p.props.forEach(ti => {
    const t = S.tiles[ti];
    if (creditor && creditor.alive) { t.owner = creditor.id; creditor.props.push(ti); }
    else { t.owner = null; t.level = 0; }
    refreshTile(ti);
  });
  p.props = [];
  p.stocks = {tech: 0, land: 0, bank: 0, oil: 0};
  p.savings = 0;
  log(`💥 <b style="color:${p.color}">${p.name}</b> 破产出局！（欠款 ${fmt(owed - lost)}${creditor ? '，资产归 ' + creditor.name : ''}）`);
  sfx.bad();
  updateUI();
  await sleep(500);
  if (!p.ai && !(qs.has('autotest') || qs.has('smoketest'))) {
    await modal({
      icon: '💥', title: '你破产啦',
      html: `<p>房子卖光、现金见底，这局到此为止。<br>下次记得留点现金周转哦！</p>`,
      actions: [{label: '看看结果', v: 1}]
    });
  }
  checkEnd();
}

          sub: S.tiles[(p.pos + o) % N].name,
          val: o
        })), '取消');
    }
    if (!off) return;
    const idx = (p.pos + off) % N;
    if (S.tiles[idx].block != null || S.tiles[idx].mine != null) { if (!ai) toast('那里已经有陷阱了'); return; }
    if (isBlock) S.tiles[idx].block = p.id; else S.tiles[idx].mine = p.id;
    refreshTile(idx); used = true;
    log(`${isBlock ? '🚧' : '💣'} <b>${p.name}</b> 在「${S.tiles[idx].name}」${isBlock ? '放了路障' : '埋了地雷'}`);
  }

  else if (id === 'tp') {
    const best = mine => mine.length ? mine.sort((a, b) => invested(S.tiles[b]) - invested(S.tiles[a]))[0] : null;
    const myBest = best(p.props.slice());
    const otherBest = best(allPropsOfOthers(p).map(t => t.i));
    const opts = [
      {icon: '🏁', name: '起点', sub: '领过路费 + 点数', val: 0},
      {icon: '🛒', name: '道具店', sub: '买道具', val: S.tiles.findIndex(t => t.type === 'store')},
      {icon: '📈', name: '证券交易所', sub: '买卖股票', val: S.tiles.findIndex(t => t.type === 'stock')},
      {icon: '🏦', name: '银行', sub: '存取款', val: S.tiles.findIndex(t => t.type === 'bank')},
      {icon: '⛩️', name: '土地庙', sub: '求神仙', val: S.tiles.findIndex(t => t.type === 'temple')},
    ];
    if (myBest != null) opts.push({icon: '🏙️', name: '我的「' + S.tiles[myBest].name + '」', sub: '回去盖楼', val: myBest});
    if (otherBest != null) opts.push({icon: '☠️', name: '对手的「' + S.tiles[otherBest].name + '」', sub: '去踩雷付租', val: otherBest});
    let dest;
    if (ai) dest = pick(opts).val;
    else dest = await chooseRows('传送卡', '传送到哪里？传送后本回合不再掷骰', opts, '取消');
    if (dest == null) return;
    p.pos = dest; renderPawns(); used = true;
    log(`🌀 <b>${p.name}</b> 传送到「${S.tiles[dest].name}」`);
    await sleep(260);
    S.skipRoll = true;
    await resolveTile(p);
    if (S.rollResolve) { const r = S.rollResolve; S.rollResolve = null; setTimeout(r, 220); }
  }

  else if (id === 'rich') {
    if (!ai) {
      const ok = await modal({icon: '⚖️', title: '使用均富卡？', html: `<p>所有存活玩家的现金会被收拢后平分。<br>你现在有 <b>${fmt(p.cash)}</b>。</p>`,
        actions: [{label: '使用', v: 1}, {label: '算了', v: 0, cls: 'ghost'}]});
      if (!ok) return;
    }
    const alive = S.players.filter(q => q.alive);
    const total = alive.reduce((s, q) => s + q.cash, 0);
    const avg = Math.round(total / alive.length);
    alive.forEach(q => { q.cash = avg; });
    used = true;
    log(`⚖️ <b>${p.name}</b> 使用均富卡，所有人现金变成 ${fmt(avg)}`);
    sfx.coin(); updateUI();
  }

  else if (id === 'buycard') {
    const cand = allPropsOfOthers(p);
    if (!cand.length) { if (!ai) toast('没有可以买的地产'); return; }
    let t;
    if (ai) t = pick(cand);
    else {
      const v = await chooseRows('购地卡', '按 1.5 倍投资额强买一块地', cand.map(x => ({
        icon: LV_ICON[x.level] || '🏞️',
        name: x.name,
        sub: `${S.players[x.owner].name} · ${LV_NAME[x.level]}`,
        val: x.i, right: fmt(Math.round(invested(x) * 1.5))
      })), '取消');
      if (v == null) return;
      t = S.tiles[v];
    }
    const price = Math.round(invested(t) * 1.5);
    if (p.cash < price) { if (!ai) toast(`需要 ${fmt(price)}，现金不够`); return; }
    const from = S.players[t.owner];
    p.cash -= price; from.cash += price;
    from.props = from.props.filter(i => i !== t.i);
    t.owner = p.id; p.props.push(t.i);
    used = true;
    log(`🏷️ <b>${p.name}</b> 用 ${fmt(price)} 从 ${from.name} 手里买下「${t.name}」`);
    sfx.buy(); refreshTile(t.i); updateUI();
  }

  else if (id === 'wreck') {
    const cand = allPropsOfOthers(p).filter(t => t.level > 0);
    if (!cand.length) { if (!ai) toast('对手没有可拆的建筑'); return; }
    let t;
    if (ai) t = pick(cand);
    else {
      const v = await chooseRows('拆迁卡', '把对手一栋楼拆回空地', cand.map(x => ({
        icon: LV_ICON[x.level], name: x.name, sub: `${S.players[x.owner].name} · ${LV_NAME[x.level]}`, val: x.i
      })), '取消');
      if (v == null) return;
      t = S.tiles[v];
    }
    t.level = 0; used = true;
    log(`🔨 <b>${p.name}</b> 把「${t.name}」拆成了空地`);
    refreshTile(t.i); updateUI();
  }

  else if (id === 'free') {
    p.freePass = true; used = true;
    log(`🎫 <b>${p.name}</b> 准备好了免费卡，下次租金全免`);
  }

  else if (id === 'swap') {
    if (!p.props.length) { if (!ai) toast('你还没有地产'); return; }
    const cand = allPropsOfOthers(p);
    if (!cand.length) { if (!ai) toast('对手没有地产'); return; }
    let mineIdx, theirs;
    if (ai) { mineIdx = pick(p.props); theirs = pick(cand); }
    else {
      const v1 = await chooseRows('换地卡 · 第一步', '选一块自己的地送出去', p.props.map(i => ({
        icon: LV_ICON[S.tiles[i].level] || '🏞️', name: S.tiles[i].name,
        sub: `${LV_NAME[S.tiles[i].level]} · 值 ${fmt(invested(S.tiles[i]))}`, val: i
      })), '取消');
      if (v1 == null) return;
      const v2 = await chooseRows('换地卡 · 第二步', '想换对手哪一块地？', cand.map(x => ({
        icon: LV_ICON[x.level] || '🏞️', name: x.name,
        sub: `${S.players[x.owner].name} · ${LV_NAME[x.level]} · 值 ${fmt(invested(x))}`, val: x.i
      })), '取消');
      if (v2 == null) return;
      mineIdx = v1; theirs = S.tiles[v2];
    }
    const a = S.tiles[mineIdx], b = theirs;
    const oa = S.players[a.owner], ob = S.players[b.owner];
    oa.props = oa.props.filter(i => i !== a.i);
    ob.props = ob.props.filter(i => i !== b.i);
    a.owner = ob.id; ob.props.push(a.i);
    b.owner = oa.id; oa.props.push(b.i);
    used = true;
    log(`🔄 <b>${p.name}</b> 用「${a.name}」换走了「${b.name}」`);
    refreshTile(a.i); refreshTile(b.i); updateUI();
  }

  else if (id === 'reverse') {
    p.dir *= -1;
    used = true;
    log(`↩️ <b>${p.name}</b> 调头，开始${p.dir > 0 ? '顺时针' : '逆时针'}前进`);
  }

  else if (id === 'turtle') {
    const cand = S.players.filter(q => q.alive && q !== p);
    if (!cand.length) return;
    let q;
    if (ai) q = pick(cand);
    else {
      const v = await chooseRows('乌龟卡', '让谁变成乌龟？2 回合只能走 1-2 步', cand.map(x => ({
        icon: '🐢', name: x.name, sub: `现金 ${fmt(x.cash)}`, val: x.id
      })), '取消');
      if (v == null) return;
      q = S.players[v];
    }
    q.turtle = 2; used = true;
    log(`🐢 <b>${p.name}</b> 把 ${q.name} 变成了乌龟（2 回合）`);
  }

  else if (id === 'angel') {
    p.angel = 3; used = true;
    log(`😇 <b>${p.name}</b> 获得天使保护（3 回合免租）`);
  }

  if (used) {
    p.items[id]--;
    updateUI();
    if (!ai && it) toast(`使用了「${it.name}」`);
  }
}

/* ---------------- AI 用道具 ---------------- */
async function aiUseItem(p) {
  const owned = ITEMS.filter(it => (p.items[it.id] || 0) > 0).map(it => it.id);
  if (!owned.length) return;
  if (Math.random() > 0.5) return;
  await useItem(p, pick(owned), true);
  await sleep(200);
}

/* =====================================================================
   神仙
   ===================================================================== */
function attachGod(p, id) {
  if (p.god === id) { p.godLeft = GOD_TURNS; toast(`${GODS[id].name}继续跟着 ${p.name}`); return; }
  if (p.god) log(`✨ ${GODS[p.god].name} 离开了 <b>${p.name}</b>`);
  p.god = id; p.godLeft = GOD_TURNS;
  log(`${GODS[id].icon} <b>${GODS[id].name}</b> 附身 <b>${p.name}</b>（${GOD_TURNS} 回合）：${GODS[id].desc}`);
  toast(`${p.name} 被${GODS[id].name}附身`);
  sfx.coin();
  updateUI();
}

async function godTick(p) {
  if (!p.god) return;
  if (p.god === 'qiong') {
    const loss = Math.max(300, Math.round(p.cash * 0.05));
    await payMoney(p, loss);
    log(`👺 穷神让 <b>${p.name}</b> 又赔了 ${fmt(loss)}`);
  }
  p.godLeft--;
  if (p.godLeft <= 0) {
    log(`✨ ${GODS[p.god].icon} ${GODS[p.god].name} 离开了 ${p.name}`);
    p.god = null;
    updateUI();
  }
}

/* =====================================================================
   股票 / 银行
   ===================================================================== */
function stockTick() {
  S.stocks.forEach(s => {
    const drift = (Math.random() - 0.46) * 0.15;
    s.price = Math.max(8, Math.round(s.price * (1 + drift)));
    s.hist.push(s.price);
    if (s.hist.length > 14) s.hist.shift();
  });
}
function buyStock(p, id, qty) {
  const s = S.stocks.find(x => x.id === id);
  const cost = s.price * qty;
  if (p.cash < cost) return false;
  p.cash -= cost;
  p.stocks[id] = (p.stocks[id] || 0) + qty;
  p.stockCost[id] = (p.stockCost[id] || 0) + cost;
  updateUI();
  return true;
}
function sellStock(p, id, qty) {
  const s = S.stocks.find(x => x.id === id);
  const held = p.stocks[id] || 0;
  if (held < qty) return false;
  const gained = s.price * qty;
  const avg = (p.stockCost[id] || 0) / held;
  p.stocks[id] = held - qty;
  p.stockCost[id] = Math.max(0, (p.stockCost[id] || 0) - avg * qty);
  p.cash += gained;
  updateUI();
  return true;
}
async function bankDialog(p) {
  const v = await modal({
    icon: '🏦', title: '银行',
    html: `<p>存款每回合利息 <b>${Math.round(INTEREST * 100 * (p.charId === 'qian' ? 2 : 1))}%</b>，均富卡和查税都动不了存款。</p>
      <table class="prop-table">
        <tr><td>现金</td><td>${fmt(p.cash)}</td></tr>
        <tr><td>存款</td><td>${fmt(p.savings)}</td></tr>
      </table>`,
    actions: [
      {label: '存 $5,000', v: 'd5'}, {label: '存全部', v: 'dall'},
      {label: '取 $5,000', v: 'w5'}, {label: '取全部', v: 'wall'},
      {label: '离开', v: 0, cls: 'ghost'}
    ]
  });
  if (v === 'd5') { const a = Math.min(5000, p.cash); p.cash -= a; p.savings += a; toast(`存入 ${fmt(a)}`); }
  else if (v === 'dall') { p.savings += p.cash; toast(`存入 ${fmt(p.cash)}`); p.cash = 0; }
  else if (v === 'w5') { const a = Math.min(5000, p.savings); p.savings -= a; p.cash += a; toast(`取出 ${fmt(a)}`); }
  else if (v === 'wall') { p.cash += p.savings; toast(`取出 ${fmt(p.savings)}`); p.savings = 0; }
  updateUI();
}

/* =====================================================================
   回合与移动
   ===================================================================== */
function passGo(p, silent) {
  let amt = PASS_GO;
  if (p.god === 'cai') amt *= 2;
  if (p.charId === 'tu') amt += 300;
  if (p.charId === 'qian') amt += 500;
  amt = Math.round(amt);
  p.cash += amt;
  p.pts += PASS_GO_PTS;
  log(`🏁 <b>${p.name}</b> 经过起点，领取 ${fmt(amt)} + ${PASS_GO_PTS} 点数`);
  if (!silent) { floatMoney(p, '+' + fmt(amt), '#ffe08a'); sfx.coin(); }
  updatePlayersOnly();
}

async function moveSteps(p, steps, dir = 1) {
  let hit = false;
  for (let i = 0; i < steps; i++) {
    p.pos = (p.pos + dir + N) % N;
    if (dir > 0 && p.pos === 0) passGo(p);
    renderPawns();
    if (p._el) {
      p._el.classList.add('moving');
      setTimeout(() => p._el && p._el.classList.remove('moving'), 130);
    }
    await sleep(110);
    const t = S.tiles[p.pos];
    if (t.block != null) {
      t.block = null; refreshTile(p.pos);
      log(`🚧 <b>${p.name}</b> 被路障拦在「${t.name}」`);
      toast('被路障拦住了！');
      sfx.bad();
      hit = true;
      break;
    }
    if (t.mine != null) {
      const ownerId = t.mine;
      t.mine = null; refreshTile(p.pos);
      const fine = p.charId === 'nin' ? 750 : 1500;
      const turns = p.charId === 'nin' ? 2 : 3;
      log(`💣 <b>${p.name}</b> 踩到地雷！住院 ${turns} 回合，赔偿 ${fmt(fine)}`);
      sfx.bad(); toast('踩到地雷了！');
      if (ownerId != null && S.players[ownerId]) await payMoney(p, fine, ownerId);
      else await payMoney(p, fine);
      p.hosp = turns;
      hit = true;
      break;
    }
  }
  renderPawns();
  return hit;
}

async function rollAndMove(p) {
  S.busy = true; updateUI();
  if (S.skipRoll) { S.skipRoll = false; S.busy = false; return; }
  let total;
  if (p.remote != null) {
    total = p.remote; p.remote = null;
    const a = Math.max(1, Math.floor(total / 2)), b = total - a;
    await animateDice(a, b);
  } else {
    const a = 1 + rnd(6), b = 1 + rnd(6);
    await animateDice(a, b);
    total = a + b;
  }
  if (p.turtle > 0) {
    total = 1 + rnd(2);
    log(`🐢 <b>${p.name}</b> 被乌龟卡拖住，只走 ${total} 步`);
  } else {
    if (p.god === 'fu') total += 2;
    if (p.god === 'shuai') total = Math.max(1, total - 1);
  }
  log(`🎲 <b>${p.name}</b> 掷出 <b style="color:#ffd76a">${total}</b> 点`);
  await sleep(180);
  const hit = await moveSteps(p, total, p.dir);
  if (!hit) await resolveTile(p);
  if (p.turtle > 0) { p.turtle--; if (p.turtle <= 0) log(`🐢 ${p.name} 恢复了正常速度`); }
  if (p.angel > 0) p.angel--;
  if (!S.over) checkEnd();
  S.busy = false;
  updateUI();
}

/* =====================================================================
   落地事件
   ===================================================================== */
async function resolveTile(p, depth = 0) {
  const t = S.tiles[p.pos];
  await sleep(150);

  if (isProp(t)) {
    if (t.owner == null) await tryBuy(p, t);
    else if (t.owner === p.id) await tryUpgrade(p, t);
    else await payRent(p, t);
    return;
  }

  switch (t.type) {
    case 'start':
      gain(p, 500); p.pts += 100;
      log(`🏁 <b>${p.name}</b> 停在起点，额外奖励 $500 + 100 点数`);
      break;
    case 'tax': {
      const tax = Math.max(900, Math.round(p.cash * 0.1));
      log(`🧾 <b>${p.name}</b> 缴纳所得税 ${fmt(tax)}（进入停车奖池）`);
      const ok = await payMoney(p, tax);
      if (ok) { S.pot += tax; renderPark(); }
      break;
    }
    case 'park': {
      if (S.pot > 0) {
        const pot = S.pot; S.pot = 0;
        gain(p, pot);
        log(`🅿️ <b>${p.name}</b> 领走停车奖池 ${fmt(pot)}！`);
        if (!p.ai) await modal({icon: '🅿️', title: '免费停车', html: `<p>奖池里的 <b>${fmt(pot)}</b> 全归你了。</p>`, actions: [{label: '太棒了', v: 1}]});
      } else {
        log(`🅿️ <b>${p.name}</b> 免费停车，休息一下`);
      }
      renderPark();
      break;
    }
    case 'jail':
      log(`🚔 <b>${p.name}</b> 路过监狱，探个监`);
      break;
    case 'hospital':
      log(`🏥 <b>${p.name}</b> 路过医院，探望病号`);
      break;
    case 'store': await visitStore(p); break;
    case 'stock':
      if (p.ai) await aiStock(p); else await stockDialog(p);
      break;
    case 'bank':
      if (p.ai) await aiBank(p); else await bankDialog(p);
      break;
    case 'news': await doNews(p); break;
    case 'temple': await visitTemple(p); break;
    case 'chance':
    case 'fate':
      if (depth < 2) await drawCard(p, t.type);
      break;
  }
  updateUI();
}

async function sendJail(p, turns = 2) {
  const t = p.charId === 'nin' ? Math.max(1, turns - 1) : turns;
  p.pos = 12;
  p.jail = t;
  renderPawns();
  sfx.bad();
  log(`🚔 <b>${p.name}</b> 被送进监狱，停 ${t} 回合${p.charId === 'nin' ? '（忍术减 1 回合）' : ''}`);
  toast(`${p.name} 进监狱 ${t} 回合`);
  updateUI();
  await sleep(260);
}
async function sendHospital(p, turns = 3) {
  const t = p.charId === 'nin' ? Math.max(1, turns - 1) : turns;
  p.hosp = t;
  sfx.bad();
  log(`🏥 <b>${p.name}</b> 住院 ${t} 回合${p.charId === 'nin' ? '（忍术减 1 回合）' : ''}`);
  toast(`${p.name} 住院 ${t} 回合`);
  updateUI();
  await sleep(260);
}

async function payRent(p, t) {  const owner = S.players[t.owner];
  let rent = rentOf(t);
  const notes = [];
  if (p.god === 'angel' || p.angel > 0) { rent = 0; notes.push('天使护体'); }
  else if (p.freePass) { p.freePass = false; rent = 0; notes.push('免费卡生效'); }
  else {
    if (p.charId === 'sha') { rent = Math.round(rent * 0.8); notes.push('谈判 -20%'); }
    if (p.god === 'qiong') { rent = Math.round(rent * 2); notes.push('穷神 ×2'); }
  }
  if (rent <= 0) {
    log(`🛡️ <b>${p.name}</b> 踩到「${t.name}」，${notes.join('、')}，一分钱没付`);
    toast('免租金！');
    return;
  }
  log(`🏠 <b>${p.name}</b> 踩到 <b style="color:${owner.color}">${owner.name}</b> 的「${t.name}」${LV_ICON[t.level]}，付租金 <b>${fmt(rent)}</b>${notes.length ? '（' + notes.join('、') + '）' : ''}`);
  sfx.pay();
  if (p.ai && rent > p.cash * 0.8) await sleep(300);
  await payMoney(p, rent, owner.id);
}

async function tryBuy(p, t) {
  const cost = buyCost(p, t);
  if (p.cash < cost) {
    if (!p.ai) toast(`钱不够：${t.name} 要 ${fmt(cost)}`);
    return;
  }
  if (p.ai) {
    if (aiWantsBuy(p, t)) { buy(p, t); await sleep(300); }
    return;
  }
  const groupTiles = S.tiles.filter(x => isProp(x) && x.group === t.group);
  const mine = groupTiles.filter(x => x.owner === p.id).length;
  const ok = await modal({
    icon: '🏙️', title: `买下「${t.name}」？`,
    html: `<p>${GROUPS[t.group].name}地块 ${mine + 1}/${groupTiles.length}，集齐同色整组租金 <b>翻倍</b>。</p>
      ${propTableHTML(t, p)}`,
    actions: [{label: `买下 ${fmt(cost)}`, v: 1}, {label: '放弃', v: 0, cls: 'ghost'}]
  });
  if (ok) buy(p, t);
}

function buy(p, t) {
  const cost = buyCost(p, t);
  p.cash -= cost;
  t.owner = p.id;
  p.props.push(t.i);
  log(`🏙️ <b>${p.name}</b> 买下「${t.name}」${fmt(cost)}`);
  if (p._el) floatMoney(p, '-' + fmt(cost), '#ffd08a');
  sfx.buy();
  refreshTile(t.i);
  updateUI();
}

async function tryUpgrade(p, t) {
  if (t.level >= MAX_LV) { if (!p.ai) toast('已经是摩天楼啦'); return; }
  if (p.god === 'tudi') {
    upgrade(p, t, true);
    log(`⛩️ 土地公显灵，免费升级`);
    await sleep(300);
    return;
  }
  const cost = upgCost(t);
  if (p.cash < cost) { if (!p.ai) toast(`升级需要 ${fmt(cost)}`); return; }
  if (p.ai) {
    const reserve = 3000 + p.props.length * 400;
    if (p.cash - cost > reserve && Math.random() < 0.9) { upgrade(p, t); await sleep(280); }
    return;
  }
  const before = rentOf(t);
  const after = Math.round(t.price * RENT[t.level + 1] * (ownsGroup(p.id, t.group) ? 2 : 1) * (S.rentMod || 1));
  const ok = await modal({
    icon: '🏗️', title: `升级「${t.name}」？`,
    html: `<p>${LV_NAME[t.level]} → <b>${LV_NAME[t.level + 1]}</b>，租金从 ${fmt(before)} 涨到 <b>${fmt(after)}</b>。</p>
      ${propTableHTML(t, p)}`,
    actions: [{label: `升级 ${fmt(cost)}`, v: 1}, {label: '先不升', v: 0, cls: 'ghost'}]
  });
  if (ok) upgrade(p, t);
}

function upgrade(p, t, free) {
  const cost = free ? 0 : upgCost(t);
  p.cash -= cost;
  t.level++;
  log(`🏗️ <b>${p.name}</b> 把「${t.name}」升级为 <b>${LV_NAME[t.level]}</b>${cost ? `（-${fmt(cost)}）` : '（免费）'}`);
  if (!free && p._el) floatMoney(p, '-' + fmt(cost), '#ffd08a');
  sfx.buy();
  refreshTile(t.i);
  updateUI();
}

/* ---------------- 道具店 ---------------- */
async function visitStore(p) {
  if (p.ai) { await aiStore(p); return; }
  for (let guard = 0; guard < 8; guard++) {
    const rows = ITEMS.map(it => ({
      icon: it.icon, name: it.name, sub: it.desc + `（持有 ${p.items[it.id] || 0}）`,
      val: it.id, right: `💎 ${it.cost}`, disabled: p.pts < it.cost
    }));
    const v = await chooseRows(`道具店 · 你有 💎 ${p.pts} 点数`, '点数靠经过起点和事件获得，道具是翻盘关键', rows, '离开商店');
    if (v == null) return;
    const it = ITEM_MAP[v];
    if (p.pts < it.cost) { toast('点数不够'); continue; }
    p.pts -= it.cost;
    addItem(p, v, 1);
    log(`🛒 <b>${p.name}</b> 花 ${it.cost} 点数买了「${it.name}」`);
    sfx.buy();
    updateUI();
  }
}
async function aiStore(p) {
  let guard = 0;
  while (p.pts >= 80 && guard++ < 4) {
    const affordable = ITEMS.filter(it => it.cost <= p.pts);
    if (!affordable.length) break;
    const it = pick(affordable);
    p.pts -= it.cost;
    addItem(p, it.id, 1);
    log(`🛒 <b>${p.name}</b> 花 ${it.cost} 点数买了「${it.name}」`);
    await sleep(180);
  }
}

/* ---------------- 股票 ---------------- */
async function aiStock(p) {
  if (p.cash > 12000 && Math.random() < 0.75) {
    const cheap = [...S.stocks].sort((a, b) => a.price - b.price)[0];
    const qty = Math.min(300, Math.floor((p.cash * 0.25) / cheap.price / 100) * 100) || 100;
    if (buyStock(p, cheap.id, qty)) log(`📈 <b>${p.name}</b> 买入 ${cheap.name}股 ${qty} 股`);
  } else {
    for (const s of S.stocks) {
      const held = p.stocks[s.id] || 0;
      if (held > 0) {
        const avg = (p.stockCost[s.id] || 0) / held;
        if (s.price > avg * 1.15 && sellStock(p, s.id, held)) log(`📉 <b>${p.name}</b> 卖掉 ${s.name}股获利`);
      }
    }
  }
  await sleep(240);
}
async function aiBank(p) {
  if (p.cash > 14000) { const a = p.cash - 8000; p.cash -= a; p.savings += a; log(`🏦 <b>${p.name}</b> 存了 ${fmt(a)} 进银行`); }
  else if (p.cash < 3000 && p.savings > 0) { const a = Math.min(p.savings, 6000); p.savings -= a; p.cash += a; log(`🏦 <b>${p.name}</b> 从银行取出 ${fmt(a)}`); }
  await sleep(220);
}

/* ---------------- 土地庙 ---------------- */
async function visitTemple(p) {
  if (p.ai) {
    if (p.pts >= 60 && Math.random() < 0.75) {
      p.pts -= 60;

    actions: [{label: '上香祈福', v: 1}, {label: '下次吧', v: 0, cls: 'ghost'}]

async function doNews(p) {

/* ---------------- 卡片 ---------------- */
async function drawCard(p, kind) {
  const deck = kind === 'chance' ? CHANCE_CARDS : FATE_CARDS;
  let c = pick(deck);
  const lucky = (p.god === 'fu');
  const immune = (p.god === 'angel' || p.angel > 0);
  if (lucky && c.bad && Math.random() < 0.5) c = pick(deck.filter(x => !x.bad));
  const blocked = immune && c.bad;
  if (!p.ai) {
    await modal({
      icon: c.icon, title: c.title,
      html: `<p>${c.text}</p>${blocked ? '<p style="color:#2f8a5e;font-weight:800;margin-top:6px">天使护体，这次免了！</p>' : ''}`,
      actions: [{label: '继续', v: 1}], kind
    });
  } else {
    toast(`${p.name} 抽到「${c.title}」`);
    await sleep(320);
  }
  log(`${kind === 'chance' ? '🎁' : '🔮'} <b>${p.name}</b> 抽到「${c.title}」${blocked ? '（被天使挡下）' : ''}`);
  if (!blocked) await c.fn(p);
  updateUI();
}

/* =====================================================================
   AI 决策
   ===================================================================== */
function aiWantsBuy(p, t) {
  const cost = buyCost(p, t);
  if (p.cash < cost) return false;
  const groupTiles = S.tiles.filter(x => isProp(x) && x.group === t.group);
  const mine = groupTiles.filter(x => x.owner === p.id).length;
  let reserve = 2600 + p.props.length * 260;
  if (mine > 0) reserve = 1200;                 // 能凑齐一组，咬牙也买
  if (p.props.length === 0) reserve = 600;
  return p.cash - cost > reserve;
}

/* =====================================================================
   回合流程
   ===================================================================== */
function startRound() {
  S.round++;
  stockTick();
  // 利息（用上一回合新闻的利率修正）
  S.players.forEach(p => {
    if (!p.alive || p.savings <= 0) return;
    const rate = INTEREST * (p.charId === 'qian' ? 2 : 1) * (S.interestMod || 1);
    const interest = Math.round(p.savings * rate);
    if (interest > 0) {
      p.savings += interest;
      log(`🏦 <b>${p.name}</b> 收到存款利息 ${fmt(interest)}`);
    }
  });
  S.rentMod = 1;
  S.interestMod = 1;
  log(`—— 第 ${Math.min(S.round, MAX_ROUNDS)} 回合 ——`);
  if (Math.random() < 0.22) {
    const cand = S.players.filter(p => p.alive && !p.god);
    if (cand.length) attachGod(pick(cand), pick(Object.keys(GODS)));
  }
  updateUI();
}

async function playTurn(p) {
  S.busy = true;
  if (S.turnCount >= S.turnCap) { S.stopped = true; S.busy = false; return; }
  S.turnCount++;
  updateUI();
  await godTick(p);

  if (p.jail > 0) {
    p.jail--;
    log(`🚔 <b>${p.name}</b> 在监狱反省（还剩 ${p.jail} 回合）`);
    await sleep(500);
    S.busy = false; updateUI();
    return;
  }
  if (p.hosp > 0) {
    p.hosp--;
    log(`🏥 <b>${p.name}</b> 住院观察（还剩 ${p.hosp} 回合）`);
    await sleep(500);
    S.busy = false; updateUI();
    return;
  }
  if (p.charId === 'wu' && Math.random() < 0.28) {
    const it = pick(ITEMS);
    addItem(p, it.id, 1);
    log(`🐱 <b>${p.name}</b> 顺手捡到「${it.name}」`);
  }

  if (p.ai) {
    await sleep(340);
    if (S.itemSpam) {
      ITEMS.forEach(it => { p.items[it.id] = 3; });
      for (let k = 0; k < 3; k++) await useItem(p, pick(ITEMS).id, true);
    }
    await aiUseItem(p);
  } else {
    S.awaitRoll = true;
    S.busy = false;
    updateUI();
    await new Promise(r => { S.rollResolve = r; });
    S.awaitRoll = false;
    S.rollResolve = null;
    S.busy = true;
    updateUI();
  }
  await rollAndMove(p);
  S.busy = false;
  updateUI();
}

function advanceTurn() {
  if (S.over) return;
  let guard = 0;
  do {
    S.cur = (S.cur + 1) % S.players.length;
    if (S.cur === 0) {
      startRound();
      if (S.round > MAX_ROUNDS) { endByAssets(); return; }
    }
    guard++;
  } while (!S.players[S.cur].alive && guard < 12);
  updateUI();
}

async function gameLoop() {
  while (!S.over && !S.stopped) {
    const p = S.players[S.cur];
    if (p.alive) await playTurn(p);
    if (S.over || S.stopped) break;
    advanceTurn();
    await sleep(90);
  }
}

/* =====================================================================
   结束
   ===================================================================== */
function checkEnd() {
  const alive = S.players.filter(p => p.alive);
  if (alive.length <= 1) endGame(alive[0] || null);
}
function endGame(winner) {
  if (S.over) return;
  S.over = true;
  S.winner = winner;
  sfx.win();
  showResult('游戏结束', winner ? `<b>${winner.name}</b> 把对手全部熬破产了！` : '所有人都破产了…');
}
function endByAssets() {
  if (S.over) return;
  S.over = true;
  const sorted = [...S.players].filter(p => p.alive).sort((a, b) => totalAssets(b) - totalAssets(a));
  S.winner = sorted[0];
  showResult(`${MAX_ROUNDS} 回合结束`, `总资产最高的是 <b>${sorted[0].name}</b>！`);
}

}

/* ---------------- 棋盘几何 ---------------- */
function gridPos(i) {
  if (i === 0) return {c: 13, r: 13};
  if (i < 12) return {c: 13 - i, r: 13};
  if (i === 12) return {c: 1, r: 13};
  if (i < 24) return {c: 1, r: 13 - (i - 12)};
  if (i === 24) return {c: 1, r: 1};
  if (i < 36) return {c: 1 + (i - 24), r: 1};
  if (i === 36) return {c: 13, r: 1};
  return {c: 13, r: 1 + (i - 36)};
}
function tileCenter(i) {
  const g = gridPos(i);
  return {x: (g.c - .5) * CELL, y: (g.r - .5) * CELL};
}
const PAWN_OFF = [[0, -7], [-9, 3], [9, 3], [0, 10]];

  start:    ['🏁', '起点', '过路 +2000'],
  jail:     ['🚔', '监狱', '探监'],

const SPEC = {

  tax:    ['🧾', '税务局'],
  store:  ['🛒', '道具店'],
  stock:  ['📈', '证券交易所'],

  temple: ['⛩️', '土地庙'],
};

function cornerHTML(t) {
  const m = CORNER[t.type] || ['❓', t.name, ''];
  return `<div class="cicon">${m[0]}</div><div class="cname">${m[1]}</div><div class="csub">${m[2]}</div>`;
}
function tileHTML(t) {
  if (isCorner(t.type)) return cornerHTML(t);
  if (isProp(t)) {
    return `<div class="tint" style="background:${GROUPS[t.group].color};opacity:.06"></div>
      <div class="band" style="background:${GROUPS[t.group].color}"></div>

      <div class="tprice">$${t.price}</div>

  return `<div class="sicon">${s[0]}</div><div class="sname">${s[1]}</div><div class="dyn"></div>`;
}

function buildBoard() {
  TILES.forEach((t, i) => {
    const g = gridPos(i);
    const el = document.createElement('div');
    el.className = 'tile' + (isCorner(t.type) ? ' corner' : '') + (isProp(t) ? '' : (t.type === 'start' ? '' : ' ' + t.type));
    el.style.gridColumn = g.c;
    el.style.gridRow = g.r;
    el.dataset.i = i;
    el.innerHTML = tileHTML(t);
    el.onclick = () => showTileInfo(i);
    boardEl.appendChild(el);
    tileEls[i] = el;
  });
  buildCenterBadge();
}

function buildCenterBadge() {
  [0, 12, 24, 36].forEach(i => {
    const el = tileEls[i];
    if (!el) return;
    el.classList.add('corner');
    el.innerHTML = cornerHTML((S ? S.tiles : TILES)[i]);
  });
}

function refreshTile(i) {
  const t = (S ? S.tiles : TILES)[i];
  const el = tileEls[i];
  if (!el || !t) return;
  if (isProp(t)) {
    const dyn = el.querySelector('.dyn');
    if (dyn) {
      if (t.owner != null && S) {
        const p = S.players[t.owner];
        dyn.innerHTML = `<div class="own" style="background:${p.color}">${LV_ICON[t.level] || ''}</div>`;
      } else dyn.innerHTML = '';
    }
    el.classList.toggle('lvmax', t.level >= MAX_LV);
    el.classList.toggle('glow', !!(S && S.players[S.cur] && t.owner === S.players[S.cur].id && !S.over));
  }
  el.querySelectorAll('.hazard').forEach(n => n.remove());
  if (t.block != null) el.insertAdjacentHTML('beforeend', '<div class="hazard">🚧</div>');
  else if (t.mine != null) el.insertAdjacentHTML('beforeend', '<div class="hazard">💣</div>');
}

  pawnsEl.innerHTML = '';

  S.players.forEach(p => { if (p.alive) (byPos[p.pos] = byPos[p.pos] || []).push(p); });
  S.players.forEach((p, idx) => {
    if (!p.alive) return;
    const list = byPos[p.pos];
    const k = list.indexOf(p);
    const off = PAWN_OFF[k % 4];
    const c = tileCenter(p.pos);
    const el = document.createElement('div');
    el.className = 'pawn' + (S.cur === idx && !S.over ? ' turn' : '');
    el.innerHTML = avatarSVG(p.charId);
    el.style.transform = `translate3d(${c.x - 13 + off[0]}px, ${c.y - 13 + off[1]}px, 0)`;
    el.style.zIndex = String(20 + k);
    pawnsEl.appendChild(el);
    p._el = el;
  });
}

const PIPS = {1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]};

async function animateDice(a, b) {
  const d1 = $('die1'), d2 = $('die2');
  d1.classList.add('rolling'); d2.classList.add('rolling');
  const t0 = Date.now();
  while (Date.now() - t0 < 420 * SPEED) {
    setDie(d1, 1 + rnd(6)); setDie(d2, 1 + rnd(6));
    await sleep(60);

  sfx.dice();
}

/* ---------------- 股票面板 ---------------- */
function sparkSVG(hist, color) {
  const w = 84, h = 26;
  const min = Math.min(...hist), max = Math.max(...hist);
  const rng = Math.max(1, max - min);
  const pts = hist.map((v, i) => `${(i / Math.max(1, hist.length - 1)) * w},${h - 2 - ((v - min) / rng) * (h - 5)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function stockDialog(p) {
  return new Promise(resolve => {
    const ovl = $('ovl'), panel = $('panel');
    const render = () => {
      panel.className = 'panel';
      const rows = S.stocks.map(s => {
        const held = p.stocks[s.id] || 0;
        const avg = held ? (p.stockCost[s.id] || 0) / held : 0;
        const pl = held ? Math.round((s.price - avg) * held) : 0;
        const prev = s.hist.length > 1 ? s.hist[s.hist.length - 2] : s.price;
        const up = s.price >= prev;
        return `<div class="stock-row">
            <div class="sn"><b>${s.name}</b><span>${s.code}</span></div>
            <div class="sp">${sparkSVG(s.hist, up ? '#c0392b' : '#2f8a5e')}</div>
            <div class="sv ${up ? 'up' : 'down'}">${fmt(s.price)}</div>
            <div class="sact">
              <button class="btn green sm" data-buy="${s.id}">买100</button>
              <button class="btn ghost sm" data-sell="${s.id}">卖100</button>
            </div>
          </div>
          <div style="font-size:10px;color:#8a7350;text-align:right;margin:-2px 0 5px">
            持有 ${held} 股${held ? ` · <b class="${pl >= 0 ? 'up' : 'down'}">${pl >= 0 ? '盈' : '亏'} ${fmt(Math.abs(pl))}</b>` : ''}
          </div>`;
      }).join('');
      panel.innerHTML = `<h3>📈 证券交易所</h3>
        <p style="font-size:11px">现金 <b>${fmt(p.cash)}</b> · 持仓市值 <b>${fmt(stockValue(p))}</b> · 每次交易 100 股</p>
        <div style="margin-top:8px">${rows}</div>
        <div class="acts"><button class="btn gold" data-close="1">离开</button></div>`;
      panel.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
        if (buyStock(p, b.dataset.buy, 100)) { log(`📈 <b>${p.name}</b> 买入 100 股`); sfx.buy(); }
        else toast('现金不够');
        render();
      });
      panel.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
        if (sellStock(p, b.dataset.sell, 100)) { log(`📉 <b>${p.name}</b> 卖出 100 股`); sfx.coin(); }
        else toast('没有那么多股');
        render();
      });
      panel.querySelector('[data-close]').onclick = () => { ovl.classList.remove('show'); resolve(); };
    };
    ovl.classList.add('show');
    render();
  });
}

  initStart();

  if (qs.has('autotest')) {
    SPEED = 0; MUTE = true;
    $('startScreen').classList.add('hide');
    const maxTurns = parseInt(qs.get('autotest'), 10) || 400;
    startGame(4, 'tu', true);
    S.turnCap = maxTurns;
    S.itemSpam = qs.has('itemspam');
    S.loop.then(() => {
      setTimeout(() => {
        const t = `AUTOTEST_OK turns=${S.turnCount} round=${S.round} over=${S.over} `
          + `cash=${S.players.map(p => p.cash).join('/')} props=${S.players.map(p => p.props.length).join('/')} `
          + `stocks=${S.players.map(p => Object.values(p.stocks).reduce((a, b) => a + b, 0)).join('/')} `
          + `pts=${S.players.map(p => p.pts).join('/')}`;
        document.title = t;
        $('autotest-result').textContent = t;
        updateUI();
      }, 50);
    }).catch(e => {
      document.title = 'AUTOTEST_FAIL ' + e.message;
      $('autotest-result').textContent = 'FAIL ' + (e.stack || e.message);
    });
  } else if (qs.has('smoketest')) {
    SPEED = 0.05; MUTE = true;
    $('startScreen').classList.add('hide');
    const errs = [];
    window.onerror = (m, s, l) => { errs.push(m + '@' + l); };
    startGame(2, 'tu', false);
    let guard = 0;
    const tick = setInterval(() => {
      guard++;
      if (!S || S.over || S.turnCount > 80 || guard > 6000) {
        clearInterval(tick);
        const t = `SMOKE_OK turns=${S.turnCount} round=${S.round} over=${S.over} err=${errs.length} ${errs.join(' | ')}`;
        document.title = t;
        $('autotest-result').textContent = t;
        return;
      }
      const ovl = $('ovl');
      if (ovl.classList.contains('show')) {
        const b = ovl.querySelector('[data-close]') || ovl.querySelector('.btn.gold') || ovl.querySelector('.btn');
        if (b) b.click();
      } else if (S.awaitRoll && S.rollResolve) {
        $('rollBtn').click();
      }
    }, 50);
  } else if (qs.get('preview') === 'card') {
    $('startScreen').classList.add('hide');
    startGame(4, 'tu', true);
    S.stopped = true;
    setTimeout(() => modal({
      icon: '💰', title: '财神降临',
      html: '<p>财神爷看中了你，<b>附身 4 回合</b>：收租翻倍、过路费翻倍！</p>',
      actions: [{label: '继续', v: 1}], kind: 'chance'
    }), 300);
  } else if (qs.get('preview') === 'stock') {
    $('startScreen').classList.add('hide');
    startGame(4, 'tu', false);
    S.stopped = true;
    S.players[0].cash = 32000;
    S.players[0].stocks = {tech: 300, land: 100, bank: 0, oil: 0};
    S.players[0].stockCost = {tech: 30000, land: 9000, bank: 0, oil: 0};
    setTimeout(() => stockDialog(S.players[0]), 300);
  } else if (qs.get('preview') === 'store') {
    $('startScreen').classList.add('hide');
    startGame(4, 'tu', false);
    S.stopped = true;
    S.players[0].pts = 420;
    S.players[0].items = {dice: 2, block: 1, mine: 1, tp: 1, rich: 1, angel: 1};
    setTimeout(() => visitStore(S.players[0]), 300);
  } else if (qs.get('preview') === 'over') {
    $('startScreen').classList.add('hide');
    startGame(4, 'tu', true);
    S.stopped = true;
    setTimeout(() => {
      S.players[0].cash = 42000; S.players[1].alive = false; S.players[1].cash = 0;
      S.players[2].cash = 28000; S.players[3].alive = false; S.players[3].cash = 0;
      endGame(S.players[0]);
    }, 400);
  }
}
boot();

</script>
</body>
</html>
